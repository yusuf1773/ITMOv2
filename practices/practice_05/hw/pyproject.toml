[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-in-one-trainer"
version = "0.1.0"
description = "Локальный тренажёр шахматных задач «Мат в один ход»"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "chess==1.11.2",
]

[tool.setuptools.packages.find]
include = ["mate_trainer*"]

